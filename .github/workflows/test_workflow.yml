name: Azure Pipeline Workflow                 # the name shown in the Actions tab

on:                              # TRIGGER: when this runs
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write
  contents: read

jobs:                            # what to run
  azure_workflow:                # a job; the name is your choice
    runs-on: ubuntu-latest       # GitHub starts a fresh Ubuntu VM for this job
    steps:                       # run in order, top to bottom, like a script
      - name: Azure login        # a label shown in the run's log
        uses: azure/login@v3
        with: 
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          
      - name: Account Show 
        run: az account show
