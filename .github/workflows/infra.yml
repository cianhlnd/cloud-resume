name: Terraform plan and apply            # the name shown in the Actions tab

on:                              # TRIGGER: when this runs
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  
  workflow_dispatch:             # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-cloud-resume
  cancel-in-progress: false

defaults:
    run:
      working-directory: infra

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:                            # what to run
  terraform:                # a job; the name is your choice
    runs-on: ubuntu-latest       # GitHub starts a fresh Ubuntu VM for this job
    steps:                       # run in order, top to bottom, like a script
    
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Run Terraform init command
        run: terraform init -input=false

      - name: Run Terraform fmt -check command
        run: terraform fmt -check
         
      - name: Run Terraform validate command
        run: terraform validate

      - name: Run Terraform plan command
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false tfplan     